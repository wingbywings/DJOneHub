name: DJOneHubPhone
options:
  bundleIdPrefix: org.djonehub
  deploymentTarget:
    iOS: "17.0"
packages:
  DJOneHubPhoneCore:
    path: ../../shared/DJOneHubPhoneCore
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 154.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  DJOneHubPhone:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio, voip]
        DJOneHubAPNSEnvironment: $(DJONEHUB_APNS_ENVIRONMENT)
    entitlements:
      path: DJOneHubPhone.entitlements
      properties:
        aps-environment: $(DJONEHUB_APNS_ENTITLEMENT)
    dependencies:
      - package: DJOneHubPhoneCore
      - package: WebRTC
    settings:
      base:
        DEVELOPMENT_TEAM: 8AHAFH9VTZ
        PRODUCT_BUNDLE_IDENTIFIER: com.oops.djonehub
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_CFBundleDisplayName: DJ电话通
        INFOPLIST_KEY_NSCameraUsageDescription: 扫描 Mac 上的 DJOneHub 配对二维码。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 接听 DJOneHub 转接的电话时需要使用麦克风。
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 与同一网络中的 DJOneHub 建立通话音频连接。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
      configs:
        Debug:
          DJONEHUB_APNS_ENVIRONMENT: sandbox
          DJONEHUB_APNS_ENTITLEMENT: development
        Release:
          DJONEHUB_APNS_ENVIRONMENT: production
          DJONEHUB_APNS_ENTITLEMENT: production
    scheme:
      gatherCoverageData: true
      testTargets: [DJOneHubPhoneTests]
  DJOneHubPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: DJOneHubPhone
      - package: DJOneHubPhoneCore
      - package: WebRTC
