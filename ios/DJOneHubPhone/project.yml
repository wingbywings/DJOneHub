name: DJOneHubPhone
options:
  bundleIdPrefix: org.djonehub
  deploymentTarget:
    iOS: "17.0"
packages:
  DJOneHubPhoneCore:
    path: ../../shared/DJOneHubPhoneCore
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 154.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  DJOneHubPhone:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio, voip]
    dependencies:
      - package: DJOneHubPhoneCore
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.djonehub.phone
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: DJOneHub
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 接听 DJOneHub 转接的电话时需要使用麦克风。
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 与同一网络中的 DJOneHub 建立通话音频连接。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    scheme:
      gatherCoverageData: true
      testTargets: [DJOneHubPhoneTests]
  DJOneHubPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: DJOneHubPhone
      - package: DJOneHubPhoneCore
      - package: WebRTC
