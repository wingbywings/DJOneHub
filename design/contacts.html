<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系人 · DJOneHub</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="island"></div>
    <div class="statusbar">
      <span>9:41</span>
      <span class="sicons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="22" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="20" height="11" rx="3"/><rect x="2.5" y="2.5" width="14" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23 4v4" stroke-linecap="round" stroke-width="1.5"/></svg>
      </span>
    </div>

    <div class="page">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;">
        <div>
          <div class="page-title">联系人</div>
          <div class="page-sub" style="margin-bottom:14px;">给家人打个电话吧</div>
        </div>
        <div class="mini-btn" style="width:44px;height:44px;margin-bottom:16px;" title="添加联系人">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
      </div>

      <div class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        搜索姓名或号码
      </div>

      <!-- 常用联系人（家人） -->
      <div class="card-title">常用联系人</div>
      <div style="display:flex;gap:16px;padding:2px 4px 6px;margin-bottom:8px;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
          <div class="avatar av-1" style="width:60px;height:60px;font-size:22px;">妈</div>
          <span style="font-size:12.5px;font-weight:600;color:var(--ink-2);">妈妈</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
          <div class="avatar av-2" style="width:60px;height:60px;font-size:22px;">爸</div>
          <span style="font-size:12.5px;font-weight:600;color:var(--ink-2);">爸爸</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
          <div class="avatar av-3" style="width:60px;height:60px;font-size:22px;">奶</div>
          <span style="font-size:12.5px;font-weight:600;color:var(--ink-2);">奶奶</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
          <div class="avatar av-4" style="width:60px;height:60px;font-size:22px;">杰</div>
          <span style="font-size:12.5px;font-weight:600;color:var(--ink-2);">阿杰</span>
        </div>
      </div>

      <!-- 全部联系人 -->
      <div class="card-title">全部联系人</div>

      <div class="row">
        <div class="avatar av-1">妈</div>
        <div class="grow">
          <div class="t1">妈妈</div>
          <div class="t2">手机 · 138 0013 8000</div>
        </div>
        <div class="mini-btn green">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
        </div>
      </div>

      <div class="row">
        <div class="avatar av-2">爸</div>
        <div class="grow">
          <div class="t1">爸爸</div>
          <div class="t2">手机 · 139 1234 5678</div>
        </div>
        <div class="mini-btn green">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
        </div>
      </div>

      <div class="row">
        <div class="avatar av-3">奶</div>
        <div class="grow">
          <div class="t1">奶奶</div>
          <div class="t2">家里座机 · 010 8888 6666</div>
        </div>
        <div class="mini-btn green">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
        </div>
      </div>

      <div class="row">
        <div class="avatar av-4">杰</div>
        <div class="grow">
          <div class="t1">阿杰</div>
          <div class="t2">手机 · 186 5555 2233</div>
        </div>
        <div class="mini-btn green">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
        </div>
      </div>

      <div class="row">
        <div class="avatar av-5">琳</div>
        <div class="grow">
          <div class="t1">琳琳</div>
          <div class="t2">手机 · 177 9090 1122</div>
        </div>
        <div class="mini-btn green">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
        </div>
      </div>

      <div style="text-align:center;font-size:12px;color:var(--ink-3);margin-top:14px;">
        联系人仅保存在此 iPhone
      </div>
    </div>

    <div class="tabbar">
      <div class="tab">
        <span class="tab-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="2.5"/><rect x="14" y="3" width="7" height="7" rx="2.5"/><rect x="3" y="14" width="7" height="7" rx="2.5"/><rect x="14" y="14" width="7" height="7" rx="2.5"/></svg></span>
        拨号
      </div>
      <div class="tab active">
        <span class="tab-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg></span>
        联系人
      </div>
      <div class="tab">
        <span class="tab-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span>
        通话记录
      </div>
      <div class="tab">
        <span class="tab-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg></span>
        设置
      </div>
    </div>
  </div>
</div>
</body>
</html>
