<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拨号 · DJOneHub</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="island"></div>
    <div class="statusbar">
      <span>9:41</span>
      <span class="sicons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="22" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="20" height="11" rx="3"/><rect x="2.5" y="2.5" width="14" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23 4v4" stroke-linecap="round" stroke-width="1.5"/></svg>
      </span>
    </div>

    <div class="page" style="display:flex;flex-direction:column;">
      <!-- 顶部：问候 + 连接状态 -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin:8px 2px 0;">
        <div>
          <div style="font-size:22px;font-weight:800;">拨号</div>
          <div style="font-size:12.5px;color:var(--ink-2);margin-top:2px;">高清音质 · 安心通话</div>
        </div>
        <span class="status-pill"><span class="dot on"></span>已连接 · 在线</span>
      </div>

      <!-- 号码显示 + 线路 -->
      <div style="margin-top:auto;">
        <div class="dial-display">138 0013 8000</div>
        <div class="dial-module">
          <span class="module-chip">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 17l6-6-6-6M12 19h8"/></svg>
            线路：Qwen 语音克隆
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
          </span>
        </div>

        <!-- 键盘 -->
        <div class="keypad">
          <div class="key"><span class="num">1</span><span class="abc">&nbsp;</span></div>
          <div class="key"><span class="num">2</span><span class="abc">ABC</span></div>
          <div class="key"><span class="num">3</span><span class="abc">DEF</span></div>
          <div class="key"><span class="num">4</span><span class="abc">GHI</span></div>
          <div class="key"><span class="num">5</span><span class="abc">JKL</span></div>
          <div class="key"><span class="num">6</span><span class="abc">MNO</span></div>
          <div class="key"><span class="num">7</span><span class="abc">PQRS</span></div>
          <div class="key"><span class="num">8</span><span class="abc">TUV</span></div>
          <div class="key"><span class="num">9</span><span class="abc">WXYZ</span></div>
          <div class="key"><span class="num">*</span><span class="abc">&nbsp;</span></div>
          <div class="key"><span class="num">0</span><span class="abc">+</span></div>
          <div class="key"><span class="num">#</span><span class="abc">&nbsp;</span></div>
        </div>

        <!-- 呼叫操作行 -->
        <div class="dial-actions">
          <div class="ghost-btn" title="粘贴">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="16" rx="3"/><path d="M9 5a3 3 0 0 1 6 0"/></svg>
          </div>
          <button class="call-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
            呼叫
          </button>
          <div class="ghost-btn" title="删除">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 6H8l-5 6 5 6h13a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1z"/><path d="M12 10l6 6M18 10l-6 6"/></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- 标签栏 -->
    <div class="tabbar">
      <div class="tab active">
        <span class="tab-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="2.5"/><rect x="14" y="3" width="7" height="7" rx="2.5"/><rect x="3" y="14" width="7" height="7" rx="2.5"/><rect x="14" y="14" width="7" height="7" rx="2.5"/></svg></span>
        拨号
      </div>
      <div class="tab">
        <span class="tab-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg></span>
        联系人
      </div>
      <div class="tab">
        <span class="tab-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span>
        通话记录
      </div>
      <div class="tab">
        <span class="tab-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg></span>
        设置
      </div>
    </div>
  </div>
</div>
</body>
</html>
