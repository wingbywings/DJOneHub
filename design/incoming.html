<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>来电 · DJOneHub</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="island"></div>
    <div class="statusbar">
      <span>9:41</span>
      <span class="sicons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="22" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="20" height="11" rx="3"/><rect x="2.5" y="2.5" width="14" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23 4v4" stroke-linecap="round" stroke-width="1.5"/></svg>
      </span>
    </div>

    <div class="call-screen">
      <span class="module-chip" style="margin-top:8px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 17l6-6-6-6M12 19h8"/></svg>
        来电 · Qwen 语音克隆
      </span>

      <div class="call-avatar av-1">妈</div>
      <div class="call-name">妈妈</div>
      <div class="call-state">138 0013 8000 · 正在呼叫你…</div>

      <!-- 呼吸光圈提示 -->
      <div style="display:flex;gap:10px;margin-top:22px;">
        <span style="width:8px;height:8px;border-radius:50%;background:var(--violet);opacity:.35;"></span>
        <span style="width:8px;height:8px;border-radius:50%;background:var(--violet);opacity:.65;"></span>
        <span style="width:8px;height:8px;border-radius:50%;background:var(--violet);"></span>
      </div>

      <div class="incoming-actions">
        <div class="ia">
          <button class="big-btn decline">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" style="transform:rotate(135deg);"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
          </button>
          <span>拒接</span>
        </div>
        <div class="ia">
          <button class="big-btn accept">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
          </button>
          <span>接听</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
