<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
  html,body{margin:0;background:#f3edf5;height:100%;font-family:-apple-system,"SF Pro Rounded","PingFang SC",sans-serif;}
  .wrap{height:100%;display:flex;align-items:center;justify-content:center;gap:64px;padding:0 64px;}
  .col{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .squircle{overflow:hidden;border-radius:22.37%;box-shadow:0 18px 40px rgba(93,63,130,.22);}
  .squircle img{display:block;width:100%;height:100%;}
  .lbl{font-size:18px;font-weight:600;color:#6E5F82;}
</style></head>
<body>
<div class="wrap">
  <div class="col">
    <div class="squircle" style="width:360px;height:360px;"><img src="app-icon-1024.png"></div>
    <div class="lbl">180 × 180 (@2x)</div>
  </div>
  <div class="col">
    <div class="squircle" style="width:120px;height:120px;"><img src="app-icon-1024.png"></div>
    <div class="lbl">60 pt</div>
  </div>
  <div class="col">
    <div class="squircle" style="width:80px;height:80px;"><img src="app-icon-1024.png"></div>
    <div class="lbl">40 pt</div>
  </div>
  <div class="col">
    <div class="squircle" style="width:58px;height:58px;"><img src="app-icon-1024.png"></div>
    <div class="lbl">29 pt</div>
  </div>
</div>
</body>
</html>
