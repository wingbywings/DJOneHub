<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通话记录 · DJOneHub</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="island"></div>
    <div class="statusbar">
      <span>9:41</span>
      <span class="sicons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="22" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="20" height="11" rx="3"/><rect x="2.5" y="2.5" width="14" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23 4v4" stroke-linecap="round" stroke-width="1.5"/></svg>
      </span>
    </div>

    <div class="page">
      <div class="page-title">通话记录</div>
      <div class="page-sub">仅保存在此 iPhone</div>

      <div class="seg">
        <span class="on">全部</span>
        <span>未接</span>
      </div>

      <div class="group-label">今天</div>

      <!-- 呼出 · 已接通 -->
      <div class="row">
        <div class="row-ic" style="background:#E2F8EE;color:var(--green);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M9 7h8v8"/></svg>
        </div>
        <div class="grow">
          <div class="t1">妈妈</div>
          <div class="t2"><span class="tag">Qwen 语音克隆</span>&nbsp; 呼出 · 12 分钟</div>
        </div>
        <div style="text-align:right;flex:none;">
          <div style="font-size:12.5px;color:var(--ink-3);margin-bottom:6px;">09:12</div>
          <div class="mini-btn green" style="margin-left:auto;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
          </div>
        </div>
      </div>

      <!-- 未接来电 -->
      <div class="row">
        <div class="row-ic" style="background:#FFEDED;color:var(--red);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7L7 17"/><path d="M15 17H7V9"/></svg>
        </div>
        <div class="grow">
          <div class="t1" style="color:var(--red);">阿杰</div>
          <div class="t2"><span class="tag">Qwen 语音克隆</span>&nbsp; 未接来电</div>
        </div>
        <div style="text-align:right;flex:none;">
          <div style="font-size:12.5px;color:var(--ink-3);margin-bottom:6px;">08:47</div>
          <div class="mini-btn green" style="margin-left:auto;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
          </div>
        </div>
      </div>

      <!-- 呼入 · 已接通 -->
      <div class="row">
        <div class="row-ic" style="background:var(--violet-soft);color:var(--violet);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7L7 17"/><path d="M15 17H7V9"/></svg>
        </div>
        <div class="grow">
          <div class="t1">奶奶</div>
          <div class="t2"><span class="tag">标准语音</span>&nbsp; 呼入 · 3 分 02 秒</div>
        </div>
        <div style="text-align:right;flex:none;">
          <div style="font-size:12.5px;color:var(--ink-3);margin-bottom:6px;">07:55</div>
          <div class="mini-btn green" style="margin-left:auto;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
          </div>
        </div>
      </div>

      <div class="group-label">昨天</div>

      <!-- 呼出 · 未接通 -->
      <div class="row">
        <div class="row-ic" style="background:#FFF3E2;color:var(--amber);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M9 7h8v8"/></svg>
        </div>
        <div class="grow">
          <div class="t1">琳琳</div>
          <div class="t2"><span class="tag">Qwen 语音克隆</span>&nbsp; 呼出 · 未接通</div>
        </div>
        <div style="text-align:right;flex:none;">
          <div style="font-size:12.5px;color:var(--ink-3);margin-bottom:6px;">21:08</div>
          <div class="mini-btn green" style="margin-left:auto;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
          </div>
        </div>
      </div>

      <!-- 陌生号码 -->
      <div class="row">
        <div class="row-ic" style="background:var(--violet-soft);color:var(--violet);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7L7 17"/><path d="M15 17H7V9"/></svg>
        </div>
        <div class="grow">
          <div class="t1">0755 3322 1100</div>
          <div class="t2"><span class="tag">标准语音</span>&nbsp; 呼入 · 46 秒</div>
        </div>
        <div style="text-align:right;flex:none;">
          <div style="font-size:12.5px;color:var(--ink-3);margin-bottom:6px;">18:30</div>
          <div class="mini-btn green" style="margin-left:auto;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
          </div>
        </div>
      </div>

      <button class="btn btn-danger" style="margin-top:14px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/></svg>
        清除已结束的通话记录
      </button>
    </div>

    <div class="tabbar">
      <div class="tab">
        <span class="tab-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="2.5"/><rect x="14" y="3" width="7" height="7" rx="2.5"/><rect x="3" y="14" width="7" height="7" rx="2.5"/><rect x="14" y="14" width="7" height="7" rx="2.5"/></svg></span>
        拨号
      </div>
      <div class="tab">
        <span class="tab-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg></span>
        联系人
      </div>
      <div class="tab active">
        <span class="tab-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span>
        通话记录
      </div>
      <div class="tab">
        <span class="tab-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg></span>
        设置
      </div>
    </div>
  </div>
</div>
</body>
</html>
