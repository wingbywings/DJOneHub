# Include INSIDE the existing oops.work HTTPS server, alongside native
# relay.locations.conf. Uses its existing certificate and the native listener.
location = /relay-admin {
    return 302 /relay-admin/;
}

location ^~ /relay-admin/ {
    # Preserve the full URI. Do not add a trailing slash to proxy_pass.
    proxy_pass http://127.0.0.1:18443;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    client_max_body_size 32k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
    proxy_intercept_errors off;
}
