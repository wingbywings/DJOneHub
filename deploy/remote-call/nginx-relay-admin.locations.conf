# Include INSIDE the existing oops.work HTTPS server when sharing its
# hostname/certificate. Reserve /admin/ for the administration backend.
# public-origin of djonehub-relay-admin must be https://oops.work.
location = /admin {
    return 302 /admin/;
}

location ^~ /admin/ {
    # No URI/trailing slash: preserve /admin/ and /admin/api/ upstream.
    proxy_pass http://127.0.0.1:18444;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    client_max_body_size 32k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
    proxy_intercept_errors off;
}
